name: pruebas

on:
  push:
    branches: [main, feat/tercer-parcial]
  pull_request:

jobs:
  # Ruff revisa la sintaxis de 3.12 por target-version en ruff.toml, no por la versión con que corre.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.6
      - run: ruff check --output-format github .

  # En las imágenes oficiales de Python, que traen la versión exacta sin depender del Ubuntu del runner.
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    container: python:${{ matrix.python }}-bookworm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      # Bibliotecas de sistema que PySide6 carga aun sin pantalla.
      - run: apt-get update && apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r requerimientos-dev.txt
      - run: python epidemia.py pruebas -q
