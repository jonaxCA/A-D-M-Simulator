# SOLO PARA LA DEMOSTRACIÓN DE FALLOS (N5), hasta que el bloque D agregue el bucket de verdad al
# compose principal (D2). Agrega un emulador del bucket (fake-gcs-server) y lo declara en
# evidencias para que su /health y el panel de estado-servicios lo revisen. evidencias todavía
# no escribe nada en él: solo prueba la salud. MongoDB ya está en el compose principal (D1).
# Se usa encima del compose normal:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.fallos.yml --profile identidad --profile catalogos --profile vigilancia --profile escenarios --profile simulacion --profile analitica --profile plataforma up -d --wait
# Sin --profile '*': activaría el perfil gpu, que sin una GPU de NVIDIA falla.
# Cuando el bloque D agregue el bucket al compose principal, borra este archivo.
services:
  bucket:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4443/storage/v1/b"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  evidencias:
    environment:
      DEPENDENCIAS: bucket
      BUCKET_HEALTH_URL: http://bucket:4443/storage/v1/b
    depends_on:
      bucket:
        condition: service_healthy
