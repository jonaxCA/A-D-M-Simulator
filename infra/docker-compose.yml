      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_SINCRONIZACION:-postgresql://svc_sincronizacion:${DB_PASSWORD_SINCRONIZACION:-}@postgres:5432/simulador_epidemico}
      SYNC_LOTE_TTL_SECONDS: ${SYNC_LOTE_TTL_SECONDS:-604800}
      SERVICIO_CASOS_URL: http://casos:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      casos:
        condition: service_healthy

  # --- Escenarios (perfil escenarios) -------------------------------------------------------
