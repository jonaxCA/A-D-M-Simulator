      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_USUARIOS:-postgresql://svc_usuarios:${DB_PASSWORD_USUARIOS:-}@postgres:5432/simulador_epidemico}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  roles:
