      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_INTERVENCIONES:-postgresql://svc_intervenciones:${DB_PASSWORD_INTERVENCIONES:-}@postgres:5432/simulador_epidemico}
