    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_TIPOS_INTERVENCION:-postgresql://svc_tipos_intervencion:${DB_PASSWORD_TIPOS_INTERVENCION:-}@postgres:5432/simulador_epidemico}
    depends_on:
