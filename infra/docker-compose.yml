      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_CORRIDAS:-postgresql://svc_corridas:${DB_PASSWORD_CORRIDAS:-}@postgres:5432/simulador_epidemico}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  simulador:
    <<: *servicio-base
