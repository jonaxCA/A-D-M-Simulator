name: epidemia

# Parte común de los servicios. Cada uno se construye con la raíz del repositorio como
# contexto y su propio Dockerfile; el HEALTHCHECK a /health sale del Dockerfile.
# JWT_SECRET_KEY y DATABASE_URL_* van vacíos por defecto para que `up redis` no los exija; el
# servicio que arranca sin ellos falla con un mensaje claro.
x-servicio-base: &servicio-base
  restart: unless-stopped

# Todos los Dockerfile parten de epidemia/base (infra/docker/base.Dockerfile). Con
# additional_contexts el compose construye primero el servicio base y nunca la busca en
# Docker Hub.
x-construye: &construye
  context: ..
  additional_contexts:
    epidemia/base: service:base

services:
  redis:
    image: redis:7.4-alpine
    # La contraseña llega por el entorno y no se escribe en ningún archivo versionado.
    # noeviction: con la memoria llena, Redis rechaza escrituras en vez de borrar
    # sesiones o revocaciones.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en infra/.env (copia infra/.env.example)}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Solo en 127.0.0.1: nadie fuera de la máquina llega a Redis.
    ports:
      - "127.0.0.1:${REDIS_PUERTO_LOCAL:-6380}:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  base:
    image: epidemia/base
    build:
      context: ..
      dockerfile: infra/docker/base.Dockerfile
    deploy:
      replicas: 0

  # --- Identidad (perfil identidad) ---------------------------------------------------------
  auth:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/auth/Dockerfile
    profiles: [identidad]
    ports:
      - "5201:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_AUTH:-}
    depends_on:
      redis:
        condition: service_healthy
  sesiones:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/sesiones/Dockerfile
    profiles: [identidad]
    ports:
      - "5202:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_SESIONES:-}
    depends_on:
      redis:
        condition: service_healthy
  usuarios:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/usuarios/Dockerfile
    profiles: [identidad]
    ports:
      - "5203:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_USUARIOS:-}
    depends_on:
      redis:
        condition: service_healthy
  roles:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/roles/Dockerfile
    profiles: [identidad]
    ports:
      - "5204:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_ROLES:-}
    depends_on:
      redis:
        condition: service_healthy

  # --- Catálogos (perfil catalogos) ---------------------------------------------------------
  enfermedades:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/enfermedades/Dockerfile
    profiles: [catalogos]
    ports:
      - "5211:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_ENFERMEDADES:-}
    depends_on:
      redis:
        condition: service_healthy
  parametros:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/parametros/Dockerfile
    profiles: [catalogos]
    ports:
      - "5212:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_PARAMETROS:-}
    depends_on:
      redis:
        condition: service_healthy
  regiones:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/regiones/Dockerfile
    profiles: [catalogos]
    ports:
      - "5213:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_REGIONES:-}
    depends_on:
      redis:
        condition: service_healthy
  poblacion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/poblacion/Dockerfile
    profiles: [catalogos]
    ports:
      - "5214:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_POBLACION:-}
    depends_on:
      redis:
        condition: service_healthy
  tipos-intervencion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/tipos_intervencion/Dockerfile
    profiles: [catalogos]
    ports:
      - "5215:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_TIPOS_INTERVENCION:-}
    depends_on:
      redis:
        condition: service_healthy

  # --- Vigilancia (perfil vigilancia) -------------------------------------------------------
  casos:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/casos/Dockerfile
    profiles: [vigilancia]
    ports:
      - "5221:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_CASOS:-}
    depends_on:
      redis:
        condition: service_healthy
  sincronizacion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/sincronizacion/Dockerfile
    profiles: [vigilancia]
    ports:
      - "5222:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_SINCRONIZACION:-}
      SYNC_LOTE_TTL_SECONDS: ${SYNC_LOTE_TTL_SECONDS:-604800}
      SERVICIO_CASOS_URL: http://casos:8000
    depends_on:
      redis:
        condition: service_healthy
      casos:
        condition: service_healthy

  # --- Escenarios (perfil escenarios) -------------------------------------------------------
  validacion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/validacion/Dockerfile
    profiles: [escenarios]
    ports:
      - "5234:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_VALIDACION:-}
    depends_on:
      redis:
        condition: service_healthy
  escenarios:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/escenarios/Dockerfile
    profiles: [escenarios]
    ports:
      - "5231:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_ESCENARIOS:-}
      SERVICIO_VALIDACION_URL: http://validacion:8000
    depends_on:
      redis:
        condition: service_healthy
      validacion:
        condition: service_healthy
  intervenciones:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/intervenciones/Dockerfile
    profiles: [escenarios]
    ports:
      - "5232:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_INTERVENCIONES:-}
    depends_on:
      redis:
        condition: service_healthy
  aprobacion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/aprobacion/Dockerfile
    profiles: [escenarios]
    ports:
      - "5233:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_APROBACION:-}
      SERVICIO_VALIDACION_URL: http://validacion:8000
      # notificaciones (otro grupo) aún no está en este compose: el aviso es best-effort
      SERVICIO_NOTIFICACIONES_URL: ${SERVICIO_NOTIFICACIONES_URL:-http://notificaciones:8000}
    depends_on:
      redis:
        condition: service_healthy
      validacion:
        condition: service_healthy
  escenarios-xml:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/escenarios_xml/Dockerfile
    profiles: [escenarios]
    ports:
      - "5235:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_ESCENARIOS_XML:-}
      SERVICIO_VALIDACION_URL: http://validacion:8000
      SERVICIO_ESCENARIOS_URL: http://escenarios:8000
      SERVICIO_INTERVENCIONES_URL: http://intervenciones:8000
    depends_on:
      redis:
        condition: service_healthy
      validacion:
        condition: service_healthy
      escenarios:
        condition: service_healthy
      intervenciones:
        condition: service_healthy

  # --- Simulación (perfil simulacion) -------------------------------------------------------
  comparacion:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/comparacion/Dockerfile
    profiles: [simulacion]
    ports:
      - "5244:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_COMPARACION:-}
    depends_on:
      redis:
        condition: service_healthy
  pareto:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/pareto/Dockerfile
    profiles: [simulacion]
    ports:
      - "5245:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_PARETO:-}
    depends_on:
      redis:
        condition: service_healthy

  # --- Analítica (perfil analitica) ---------------------------------------------------------
  indicadores:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/indicadores/Dockerfile
    profiles: [analitica]
    ports:
      - "5251:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_INDICADORES:-}
    depends_on:
      redis:
        condition: service_healthy
  series:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/series/Dockerfile
    profiles: [analitica]
    ports:
      - "5252:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_SERIES:-}
    depends_on:
      redis:
        condition: service_healthy
  zonas:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/zonas/Dockerfile
    profiles: [analitica]
    ports:
      - "5253:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_ZONAS:-}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-datos:
