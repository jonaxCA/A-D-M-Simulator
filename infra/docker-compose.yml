      DATABASE_URL: ${DATABASE_URL_APROBACION:-postgresql://svc_aprobacion:${DB_PASSWORD_APROBACION:-}@postgres:5432/simulador_epidemico}
      SERVICIO_VALIDACION_URL: http://validacion:8000
      # Best-effort: si notificaciones no está arriba (perfil plataforma), la aprobación se
      # hace igual y solo queda un aviso en el log.
      SERVICIO_NOTIFICACIONES_URL: ${SERVICIO_NOTIFICACIONES_URL:-http://notificaciones:8000}
