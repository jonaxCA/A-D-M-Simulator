name: epidemia

# Parte común de los servicios. Cada uno se construye con la raíz del repositorio como
# contexto y su propio Dockerfile; el HEALTHCHECK a /health sale del Dockerfile.
# Las contraseñas y JWT_SECRET_KEY van vacías por defecto para que `up redis` no las exija;
# el servicio que arranca sin ellas falla con un mensaje claro. Las llena
# `python infra/genera_env.py`.
x-servicio-base: &servicio-base
  restart: unless-stopped

# Todos los Dockerfile parten de epidemia/base (infra/docker/base.Dockerfile). Con
# additional_contexts el compose construye primero el servicio base y nunca la busca en
# Docker Hub.
x-construye: &construye
  context: ..
  additional_contexts:
    epidemia/base: service:base

services:
  redis:
    image: redis:7.4-alpine
    # La contraseña llega por el entorno y no se escribe en ningún archivo versionado.
    # noeviction: con la memoria llena, Redis rechaza escrituras en vez de borrar
    # sesiones o revocaciones.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en infra/.env (copia infra/.env.example)}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Solo en 127.0.0.1: nadie fuera de la máquina llega a Redis.
    ports:
      - "127.0.0.1:${REDIS_PUERTO_LOCAL:-6380}:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # PostgreSQL con la base de la demostración. La primera vez (volumen vacío) la carga
  # postgres/10-inicializa.sh: dump, semillas, permisos del monolito y la contraseña de cada
  # rol svc_*. Solo en 127.0.0.1, para el monolito y psql; los servicios lo ven como postgres.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: simulador_epidemico
      EPIDEMIA_APP_PASSWORD: ${EPIDEMIA_APP_PASSWORD:-}
      DB_PASSWORD_APROBACION: ${DB_PASSWORD_APROBACION:-}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH:-}
      DB_PASSWORD_CASOS: ${DB_PASSWORD_CASOS:-}
      DB_PASSWORD_COMPARACION: ${DB_PASSWORD_COMPARACION:-}
      DB_PASSWORD_CORRIDAS: ${DB_PASSWORD_CORRIDAS:-}
      DB_PASSWORD_ENFERMEDADES: ${DB_PASSWORD_ENFERMEDADES:-}
      DB_PASSWORD_ESCENARIOS: ${DB_PASSWORD_ESCENARIOS:-}
      DB_PASSWORD_ESCENARIOS_XML: ${DB_PASSWORD_ESCENARIOS_XML:-}
      DB_PASSWORD_ESTADO_SERVICIOS: ${DB_PASSWORD_ESTADO_SERVICIOS:-}
      DB_PASSWORD_INDICADORES: ${DB_PASSWORD_INDICADORES:-}
      DB_PASSWORD_INTERVENCIONES: ${DB_PASSWORD_INTERVENCIONES:-}
      DB_PASSWORD_NOTIFICACIONES: ${DB_PASSWORD_NOTIFICACIONES:-}
      DB_PASSWORD_PARAMETROS: ${DB_PASSWORD_PARAMETROS:-}
      DB_PASSWORD_PARETO: ${DB_PASSWORD_PARETO:-}
      DB_PASSWORD_POBLACION: ${DB_PASSWORD_POBLACION:-}
      DB_PASSWORD_REGIONES: ${DB_PASSWORD_REGIONES:-}
      DB_PASSWORD_RESULTADOS: ${DB_PASSWORD_RESULTADOS:-}
      DB_PASSWORD_ROLES: ${DB_PASSWORD_ROLES:-}
      DB_PASSWORD_SERIES: ${DB_PASSWORD_SERIES:-}
      DB_PASSWORD_SESIONES: ${DB_PASSWORD_SESIONES:-}
      DB_PASSWORD_SIMULADOR: ${DB_PASSWORD_SIMULADOR:-}
      DB_PASSWORD_SINCRONIZACION: ${DB_PASSWORD_SINCRONIZACION:-}
      DB_PASSWORD_TIPOS_INTERVENCION: ${DB_PASSWORD_TIPOS_INTERVENCION:-}
      DB_PASSWORD_USUARIOS: ${DB_PASSWORD_USUARIOS:-}
      DB_PASSWORD_VALIDACION: ${DB_PASSWORD_VALIDACION:-}
      DB_PASSWORD_ZONAS: ${DB_PASSWORD_ZONAS:-}
    ports:
      - "127.0.0.1:${POSTGRES_PUERTO_LOCAL:-5433}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ../datos/postgres:/datos:ro
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: mientras corre la carga inicial, PostgreSQL solo escucha en su socket local,
      # así que sale healthy hasta que la base está completa.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d simulador_epidemico"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  base:
    image: epidemia/base
    build:
      context: ..
      dockerfile: infra/docker/base.Dockerfile
    deploy:
      replicas: 0

  # --- Identidad (perfil identidad) ---------------------------------------------------------
  auth:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/auth/Dockerfile
    profiles: [identidad]
    ports:
      - "5201:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_AUTH:-postgresql://svc_auth:${DB_PASSWORD_AUTH:-}@postgres:5432/simulador_epidemico}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  sesiones:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/sesiones/Dockerfile
    profiles: [identidad]
    ports:
      - "5202:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL_SESIONES:-postgresql://svc_sesiones:${DB_PASSWORD_SESIONES:-}@postgres:5432/simulador_epidemico}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  usuarios:
    <<: *servicio-base
    build:
      <<: *construye
      dockerfile: microservicios/usuarios/Dockerfile
    profiles: [identidad]
